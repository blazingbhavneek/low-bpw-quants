[project]
name = "low-bpw-quants"
version = "0.1.0"
description = "Streaming, sub-2-bpw quantization for routed MoE experts"
readme = "README.md"
authors = [
    { name = "blazingbhavneek", email = "bhavneek2002@gmail.com" }
]
requires-python = ">=3.13"
dependencies = ["gguf>=0.19", "numpy>=2", "safetensors>=0.6", "torch>=2.8"]

[project.scripts]
low-bpw-quants = "low_bpw_quants:main"

[project.optional-dependencies]
reference = ["transformers>=5.23,<6", "accelerate>=1.10"]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
